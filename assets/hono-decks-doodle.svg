<svg xmlns="http://www.w3.org/2000/svg" width="720" height="144" viewBox="0 0 720 144" role="img" aria-labelledby="title desc">
  <title id="title">MDXからスライドへ</title>
  <desc id="desc">deck.mdxから小さな紙が飛び出し、にっこりしたスライドが跳ねます。</desc>
  <style>
    :root {
      --bg: #fbf2e5;
      --rule: #e7d4bd;
      --ink: #50352b;
      --muted: #79584b;
      --editor: #fff9ee;
      --coral: #dc876e;
      --pink: #f5bca9;
      --lilac: #ded3ec;
      --slide: #fff9ef;
      --gold: #e2b66e;
      --ease: cubic-bezier(.23, 1, .32, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #261e1c;
        --rule: #49352c;
        --ink: #f6dfcc;
        --muted: #c4a595;
        --editor: #332724;
        --coral: #f19b81;
        --pink: #895444;
        --lilac: #57496d;
        --slide: #48322b;
        --gold: #efd08a;
      }
    }
    .label { font: 600 13px ui-monospace, Consolas, monospace; }
    .caption { font: 700 18px ui-monospace, Consolas, monospace; }
    .hello { font: italic 700 30px Georgia, serif; }
    .ticket { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .face-eye { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .ticket { animation: travel 1100ms var(--ease) 300ms both; }
      .card { animation: hop 480ms var(--ease) 1300ms both; }
      .face-eye { animation: wink 220ms var(--ease) 1530ms both; }
    }
    @keyframes travel {
      0% { opacity: 0; transform: translate(0, 4px) rotate(-10deg) scale(.94); }
      18% { opacity: 1; }
      76% { opacity: 1; transform: translate(135px, -22px) rotate(12deg); }
      100% { opacity: 0; transform: translate(190px, 4px) rotate(3deg) scale(.94); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-7px); }
    }
    @keyframes wink {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(.22); }
    }
  </style>

  <rect x=".5" y=".5" width="719" height="143" rx="14" fill="var(--bg)" stroke="var(--rule)"/>

  <g transform="translate(78 28)">
    <path d="M17 8h145a10 10 0 0 1 10 10v68a10 10 0 0 1-10 10H17A10 10 0 0 1 7 86V18A10 10 0 0 1 17 8Z" fill="var(--pink)"/>
    <rect width="172" height="88" rx="10" fill="var(--editor)" stroke="var(--coral)" stroke-width="1.5"/>
    <path d="M1 29h170" stroke="var(--rule)"/>
    <circle cx="15" cy="15" r="3" fill="var(--coral)"/>
    <text x="26" y="19" class="label" fill="var(--muted)">deck.mdx</text>
    <text x="16" y="63" class="caption" fill="var(--ink)"><tspan fill="var(--coral)">#</tspan> Hello!</text>
    <path d="M109 50v15" stroke="var(--coral)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <path d="M277 81c42-24 94-24 142-2" fill="none" stroke="var(--coral)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="3 8"/>
  <path d="M413 71l8 10-12 1" fill="none" stroke="var(--coral)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(263 65)">
    <g class="ticket">
      <rect width="27" height="20" rx="4" fill="var(--slide)" stroke="var(--coral)" stroke-width="1.5"/>
      <path d="M7 7h11M7 12h8" stroke="var(--coral)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(467 33)">
    <rect x="4" y="3" width="158" height="78" rx="10" fill="var(--lilac)" transform="rotate(8 83 42)"/>
    <rect x="-6" y="8" width="153" height="77" rx="10" fill="var(--pink)" transform="rotate(-7 70 46)"/>
    <g class="card">
      <rect width="153" height="78" rx="10" fill="var(--slide)" stroke="var(--coral)" stroke-width="1.5"/>
      <text x="12" y="49" class="hello" fill="var(--ink)">Hello!</text>
      <circle cx="115" cy="36" r="2.2" fill="var(--ink)"/>
      <circle cx="129" cy="36" r="2.2" class="face-eye" fill="var(--ink)"/>
      <path d="M118 45q4 5 8 0" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="110" cy="43" rx="3" ry="1.7" fill="var(--pink)"/>
      <ellipse cx="134" cy="43" rx="3" ry="1.7" fill="var(--pink)"/>
    </g>
  </g>

  <g fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round">
    <path d="M648 28v14m-7-7h14M660 58v8m-4-4h8"/>
    <path d="M57 96v10m-5-5h10"/>
  </g>
</svg>
